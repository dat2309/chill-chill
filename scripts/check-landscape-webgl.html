<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#c9d7de;font:14px sans-serif}#grid{display:grid;grid-template-columns:repeat(3,480px)}figure{margin:0}img{width:480px;height:380px}pre{white-space:pre-wrap}</style></head><body><pre id="result">RUNNING</pre><div id="grid"></div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GardenTheme} from '/src/three/themes/garden/index.ts';import {BeachTheme} from '/src/three/themes/beach/index.ts';
window.requestAnimationFrame=f=>setTimeout(()=>f(performance.now()),0);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,1013);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const errors=[];const old=console.error;console.error=(...a)=>{errors.push(a.join(' '));old(...a)};
const state={timeOfDay:14,tide:'high',rippleStrength:.5,flowSpeed:.5,windStrength:.45,autoRotate:false,quality:'high'};
function camera(t){const p=t.cameraPreset,h=p.baseFrustumHeight,a=480/380,c=new THREE.OrthographicCamera(-h*a/2,h*a/2,h/2,-h/2,.1,150);c.position.copy(p.position);c.lookAt(p.target);return c}
function close(target,offset,h){const a=480/380,c=new THREE.OrthographicCamera(-h*a/2,h*a/2,h/2,-h/2,.1,150);c.position.copy(target).add(offset);c.lookAt(target);return c}
function snap(scene,c,label){renderer.render(scene,c);const f=document.createElement('figure'),t=document.createElement('figcaption'),img=document.createElement('img');t.textContent=label;img.src=renderer.domElement.toDataURL();f.append(t,img);document.querySelector('#grid').append(f)}
function update(theme,season,seconds,wind=.45){const s={...state,themeId:theme.id,season,windStrength:wind};theme.applyState(s);for(let i=0;i<seconds/.1;i++)theme.update(.1,i*.1,s)}
try{
 const garden=new GardenTheme({});await garden.init();const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcd1da);scene.add(garden.group);const gc=camera(garden);
 update(garden,'summer',8);snap(scene,gc,'Garden summer default');const mountain=close(new THREE.Vector3(-4,2.5,-4.5),new THREE.Vector3(3,2,5),6.5);snap(scene,mountain,'Garden summer pine and slopes');
 const terrain=garden.group.getObjectByName('DioramaTerrainMesh'),material=terrain.material,veg=garden.group.getObjectByName('VegetationSystem');veg.visible=false;
 const clay=new THREE.MeshStandardMaterial({color:0x999a94,roughness:1});terrain.material=clay;snap(scene,mountain,'Garden clay slopes, vegetation hidden');
 const normals=new THREE.MeshNormalMaterial();terrain.material=normals;snap(scene,mountain,'Garden normal slopes, vegetation hidden');terrain.material=material;veg.visible=true;clay.dispose();normals.dispose();
 snap(scene,close(new THREE.Vector3(0,.1,4),new THREE.Vector3(14,2,20),18),'Garden soil cut side');
 update(garden,'winter',10);snap(scene,gc,'Garden complete winter default');snap(scene,mountain,'Garden winter pine and slopes');snap(scene,close(new THREE.Vector3(0,0,0),new THREE.Vector3(0,30,.01),23),'Garden winter top');snap(scene,close(new THREE.Vector3(0,1,0),new THREE.Vector3(25,6,0),23),'Garden winter side');snap(scene,close(new THREE.Vector3(-5,4.2,-5),new THREE.Vector3(2,1,4),3.5),'Garden winter branch snow close');
 const supports=[];garden.group.traverse(o=>{if(o.name.startsWith('domeTent_')||o.name==='GardenTimber')supports.push({name:o.name,box:new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).toArray(),position:o.position.toArray()})});
 garden.dispose();const beach=new BeachTheme({});await beach.init();const bs=new THREE.Scene();bs.background=new THREE.Color(0xbcd1da);bs.add(beach.group);const bc=camera(beach);update(beach,'dry',8);snap(bs,bc,'Beach dry default');snap(bs,close(new THREE.Vector3(0,2,-5),new THREE.Vector3(4,2,6),8),'Beach casuarina crown and gaps');snap(bs,close(new THREE.Vector3(0,2,-5),new THREE.Vector3(0,1,10),8),'Beach casuarina side silhouette');update(beach,'rainy',20,1.2);snap(bs,bc,'Beach rainy strong wind');snap(bs,close(new THREE.Vector3(0,0,0),new THREE.Vector3(0,30,.01),23),'Beach rainy top');snap(bs,close(new THREE.Vector3(0,1,0),new THREE.Vector3(25,6,0),23),'Beach rainy side');beach.dispose();
 document.querySelector('#result').textContent=JSON.stringify({status:errors.length?'FAIL':'PASS',errors,supports});
}catch(e){document.querySelector('#result').textContent=JSON.stringify({status:'FAIL',message:e.stack,errors})}
</script></body></html>
