<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#c9d7de;font:14px sans-serif}#grid{display:grid;grid-template-columns:repeat(4,360px)}figure{margin:0}img{width:360px}pre{white-space:pre-wrap}</style></head><body><pre id="result">RUNNING</pre><div id="grid"></div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {GardenTheme} from '/src/three/themes/garden/index.ts';
window.requestAnimationFrame=f=>setTimeout(()=>f(performance.now()),0);
const errors=[],old=console.error;console.error=(...a)=>{errors.push(a.join(' '));old(...a)};
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1200,1000);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;
function camera(target,offset,height){const a=1.2,c=new THREE.OrthographicCamera(-height*a/2,height*a/2,height/2,-height/2,.1,150);c.position.copy(target).add(offset);c.lookAt(target);return c}
function snap(scene,c,label){renderer.render(scene,c);const f=document.createElement('figure'),t=document.createElement('figcaption'),img=document.createElement('img');t.textContent=label;img.src=renderer.domElement.toDataURL();f.append(t,img);document.querySelector('#grid').append(f)}
try{
 const theme=new GardenTheme({});await theme.init();const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcd1da);scene.add(theme.group);
 const preset=theme.cameraPreset,defaultCamera=camera(preset.target,preset.position.clone().sub(preset.target),preset.baseFrustumHeight);
 const top=camera(new THREE.Vector3(0,0,0),new THREE.Vector3(0,30,.01),23),close=camera(new THREE.Vector3(-4.5,1.3,-1.4),new THREE.Vector3(5,5,8),9);
 const actual=theme.group.getObjectByName('DioramaTerrainMesh'),material=new THREE.MeshBasicMaterial({vertexColors:true}),debug=new THREE.Scene();debug.background=scene.background;const isolated=new THREE.Mesh(actual.geometry,material);debug.add(isolated);
 const geometryBefore=Array.from(actual.geometry.getAttribute('position').array);
 for(const season of ['spring','summer','autumn','winter']){
  const state={themeId:'garden',season,timeOfDay:14,tide:'high',rippleStrength:.5,flowSpeed:.5,windStrength:.3,autoRotate:false,quality:'high'};theme.applyState(state);for(let i=0;i<100;i++)theme.update(.1,i*.1,state);
  snap(scene,defaultCamera,season+' default');snap(scene,close,season+' glamping close');snap(scene,top,season+' top');snap(debug,top,season+' actual vertex colors, decorations hidden');
 }
 const fixed=geometryBefore.every((v,i)=>v===actual.geometry.getAttribute('position').array[i]);
 document.querySelector('#result').textContent=JSON.stringify({status:!errors.length&&fixed?'PASS':'FAIL',errors,geometryUnchanged:fixed,camera:preset.position.toArray(),time:14,tide:'high'});material.dispose();theme.dispose();
}catch(e){document.querySelector('#result').textContent=JSON.stringify({status:'FAIL',error:e.stack,errors})}
</script></body></html>
